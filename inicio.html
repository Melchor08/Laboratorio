<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario CBTis258 - Profesional</title>
    <style>
        :root {
            --primary: #0f4c81;
            --secondary: #1e88e5;
            --bg-light: #f4f6f8;
            --text-dark: #333;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal (Estilo Smartphone) */
        .phone {
            width: 100%;
            max-width: 410px;
            height: 820px;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #222; /* Marco del teléfono */
        }

        /* Cabecera Fija */
        header {
            padding: 30px 20px 10px;
            background: white;
            text-align: center;
            z-index: 10;
        }

        h1 {
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* Área de Contenido con Scroll */
        .content {
            flex: 1;
            padding: 0 20px;
            overflow-y: auto;
            scrollbar-width: none; /* Ocultar scroll en Firefox */
        }

        .content::-webkit-scrollbar { display: none; } /* Ocultar scroll en Chrome/Safari */

        section {
            margin-bottom: 25px;
        }

        h3 {
            color: var(--text-dark);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid de Tarjetas Mejorado */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: var(--bg-light);
            padding: 15px;
            border-radius: 18px;
            transition: transform 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card h2 {
            font-size: 1.6rem;
            color: var(--secondary);
            margin-bottom: 4px;
        }

        .card p {
            font-size: 0.75rem;
            color: #666;
            font-weight: 600;
        }

        /* Colores de estado */
        .border-success { border-left: 4px solid var(--success); }
        .border-warning { border-left: 4px solid var(--warning); }
        .border-danger { border-left: 4px solid var(--danger); }

        /* Navegación Inferior Estilo App */
        .bottom-nav {
            background: #ffffff;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px 5px 25px; /* Padding extra abajo para el diseño de móvil */
            border-top: 1px solid #eee;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 0.65rem;
            font-weight: 600;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--secondary);
        }

        .nav-icon {
            font-size: 1.2rem;
        }

        .logout {
            color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="phone">
        <header>
            <h1>CBTis 258</h1>
            <p style="font-size: 0.8rem; color: #888;">Sistema de Inventario</p>
        </header>

        <div class="content">
            
            <section>
                <h3>📊 Equipos</h3>
                <div class="cards-grid">
                    <div class="card"><h2>15</h2><p>Totales</p></div>
                    <div class="card border-success"><h2>9</h2><p>Operativos</p></div>
                    <div class="card border-warning"><h2>3</h2><p>Mantenimiento</p></div>
                    <div class="card border-danger"><h2>3</h2><p>Dañados</p></div>
                </div>
            </section>

            <section>
                <h3>⚠️ Reportes y Fallas</h3>
                <div class="cards-grid">
                    <div class="card"><h2>6</h2><p>Reportes</p></div>
                    <div class="card border-danger"><h2>2</h2><p>Pendientes</p></div>
                    <div class="card border-warning"><h2>2</h2><p>En Proceso</p></div>
                    <div class="card border-success"><h2>2</h2><p>Resueltos</p></div>
                </div>
            </section>

            <section>
                <h3>🧪 Laboratorios</h3>
                <div class="cards-grid" style="grid-template-columns: repeat(3, 1fr);">
                    <div class="card" style="padding: 10px;"><h2>L1</h2><p>Soporte</p></div>
                    <div class="card" style="padding: 10px;"><h2>L2</h2><p>Program.</p></div>
                    <div class="card" style="padding: 10px;"><h2>L3</h2><p>Usos M.</p></div>
                </div>
            </section>

        </div>

        <nav class="bottom-nav">
            <a href="inicio.html" class="nav-item active">
                <span class="nav-icon">🏠</span>
                Inicio
            </a>
            <a href="gestion_de_equipos.html" class="nav-item">
                <span class="nav-icon">💻</span>
                Equipos
            </a>
            <a href="reporte.html" class="nav-item">
                <span class="nav-icon">📄</span>
                Reportes
            </a>
            <a href="inicio_secion.html" class="nav-item logout">
                <span class="nav-icon">🚪</span>
                Salir
            </a>
        </nav>
    </div>

</body>
</html>
