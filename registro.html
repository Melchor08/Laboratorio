<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - CBTis 258</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f4c81;
            --accent: #3b82f6;
            --bg-body: #eef2f7;
            --card-white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e88e5, #0f4c81);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor Smartphone Premium */
        .phone-container {
            width: 380px;
            height: 800px;
            background: var(--bg-body);
            border-radius: 45px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 10px solid #1a1a1a;
        }

        .phone-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background: #1a1a1a;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }

        header {
            padding: 45px 25px 20px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .back-link {
            text-decoration: none;
            font-size: 18px;
            color: var(--text-muted);
        }

        /* Contenido Principal con Scroll */
        .main-scroll {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .main-scroll::-webkit-scrollbar { display: none; }

        /* Tarjeta de Formulario */
        .form-card {
            background: white;
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .field-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Botones Profesionales */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-register { background: var(--primary); color: white; }
        .btn-delete { background: #f1f5f9; color: var(--danger); }
        
        .btn:active { transform: scale(0.97); }

        /* Barra de navegación inferior */
        .nav-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 15px 10px 30px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .nav-btn {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
        }

        .nav-btn.active { color: var(--accent); }

    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <h1>Nuevo Usuario</h1>
            <a href="index.html" class="back-link">🏠</a>
        </header>

        <main class="main-scroll">
            
            <div class="form-card">
                <div class="field-group">
                    <label>Nombre Completo:</label>
                    <input type="text" placeholder="Ej. Juan Pérez">
                </div>

                <div class="field-group">
                    <label>Usuario:</label>
                    <input type="text" placeholder="Nombre de acceso">
                </div>

                <div class="field-group">
                    <label>Contraseña:</label>
                    <input type="password" placeholder="••••••••">
                </div>

                <div class="field-group">
                    <label>Rol de Usuario:</label>
                    <select>
                        <option>Docente / Usuario</option>
                        <option>Administrador</option>
                        <option>Soporte Técnico</option>
                        <option>Directivo</option>
                        <option>Almacén</option>
                        <option>Responsable</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn btn-register">Registrar Usuario</button>
                    <button class="btn btn-delete">Eliminar Datos</button>
                </div>
            </div>

        </main>

        <nav class="nav-bar">
    <a href="inicio.html" class="nav-btn"><span></span>Inicio</a>
    <a href="gestion_de_equipos.html" class="nav-btn"><span></span>Equipos</a>
    <a href="fallas.html" class="nav-btn"><span></span>Fallas</a>
    <a href="reporte.html" class="nav-btn"><span></span>Reportes</a>
    <a href="index.html" class="nav-btn" style="color: var(--danger);"><span></span>Salir</a>
</nav>
    </div>

</body>
</html>
